[workspace]
members = ["crates/*", "examples"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
confluence-core = { path = "crates/confluence-core" }
confluence-plugins = { path = "crates/confluence-plugins" }
confluence-net = { path = "crates/confluence-net" }
confluence-relay = { path = "crates/confluence-relay" }
confluence-edge = { path = "crates/confluence-edge" }
confluence-runtime = { path = "crates/confluence-runtime" }
confluence-testkit = { path = "crates/confluence-testkit" }
bytes = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false }
thiserror = "2"
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
