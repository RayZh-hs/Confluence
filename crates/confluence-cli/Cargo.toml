[package]
name = "confluence-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Declarative TOML node runner and keygen CLI for Confluence"

[lib]
name = "confluence_cli"
path = "src/lib.rs"

[[bin]]
name = "confluence"
path = "src/main.rs"

[dependencies]
clap.workspace = true
confluence-carriers.workspace = true
confluence-core.workspace = true
confluence-edge.workspace = true
confluence-policy.workspace = true
confluence-relay.workspace = true
confluence-routing.workspace = true
hex.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
