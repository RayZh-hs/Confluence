[package]
name = "confluence-core"
description = "Runtime-independent two-plane A-to-B connectivity core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]
test-support = []

[dependencies]
async-broadcast = "0.7"
async-channel = "2"
async-lock = "3"
blake3 = { version = "1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
event-listener = "5"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", optional = true, features = ["derive"] }
subtle = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
confluence-core = { path = ".", features = ["test-support"] }
serde_json = "1"
