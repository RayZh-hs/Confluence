# Direct Topology — Alice (Originator Node)
# Connects directly to Bob and binds remote "demo-app" onto local 127.0.0.1:18080 (TCP) & :18081 (UDP).

[policy]
default_allow = false
default_ttl_secs = 300

[[scopes]]
id = "lab"
secret_key = "1111111111111111111111111111111111111111111111111111111111111111"

[[udp_carriers]]
id = "udp0"
bind_addr = "127.0.0.1:0"
mtu = 1400

[[tcp_carriers]]
id = "tcp0"

[[routes]]
scope = "lab"
target_pubkey = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20" # Bob
plane = "stream"
entry_channel = "tcp0"
entry_addr = "127.0.0.1:14101"
target_credential = "shared-lab-token"

[[routes]]
scope = "lab"
target_pubkey = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20" # Bob
plane = "datagram"
entry_channel = "udp0"
entry_addr = "127.0.0.1:14100"
target_credential = "shared-lab-token"

[[bind_endpoints]]
scope = "lab"
target_pubkey = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20"
endpoint = "demo-app"
plane = "stream"
listen_addr = "127.0.0.1:18080"

[[bind_endpoints]]
scope = "lab"
target_pubkey = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20"
endpoint = "demo-app"
plane = "datagram"
listen_addr = "127.0.0.1:18081"
