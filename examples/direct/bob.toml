# Direct Topology (A -> B) — Bob (Destination)

[policy]
default_allow = false
default_ttl_secs = 300

[[policy.rules]]
scope = "default"
peers = ["7b4e909bbe7ffe44c465a220037d608ee35897d31ef972f07f74892cb0f73f13"] # Alice
action = "endpoint"
plane = "stream"
target = "demo-tcp"
required_credential = "bob-e2e-token"
max_concurrent_streams = 32

[[policy.rules]]
scope = "default"
peers = ["7b4e909bbe7ffe44c465a220037d608ee35897d31ef972f07f74892cb0f73f13"] # Alice
action = "endpoint"
plane = "datagram"
target = "demo-udp"
required_credential = "bob-e2e-token"

[[scopes]]
name = "default"
secret_key = "2222222222222222222222222222222222222222222222222222222222222222"
under_load = false

[[udp_listeners]]
bind_addr = "127.0.0.1:14100"
mtu = 1400

[[tcp_listeners]]
listen_addr = "127.0.0.1:14101"

[[publish_endpoints]]
scope = "default"
endpoint = "demo-tcp"
plane = "stream"
local_target = "127.0.0.1:8080"

[[publish_endpoints]]
scope = "default"
endpoint = "demo-udp"
plane = "datagram"
local_target = "127.0.0.1:8081"
min_mtu = 1232
