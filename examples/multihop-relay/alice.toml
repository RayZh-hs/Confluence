# Multi-Hop + Passive Relay Topology (A -> H1 -> R <- B) — Alice (Originator Node)
# Executes single-pass 1-RTT chain setup across H1 (NoiseAclChannel) and R (Passive Relay) to Bob!

[policy]
default_allow = false

[[scopes]]
id = "lab"
secret_key = "1111111111111111111111111111111111111111111111111111111111111111"

[[udp_carriers]]
id = "udp0"
bind_addr = "127.0.0.1:0"

[[tcp_carriers]]
id = "tcp0"

[[routes]]
scope = "lab"
target_pubkey = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20" # Bob
plane = "stream"
entry_channel = "tcp0"
entry_addr = "127.0.0.1:16101" # H1 TCP
target_credential = "bob-e2e-token"

[[routes.hops]]
channel_pubkey = "219e4d800da968d2a5fcb009c784f4746c7138edb9ee4844b739e830b05cf424" # H1 Stream
next_addr = "127.0.0.1:16201"                                                       # Relay TCP
credential = "hop1-transit-token"

[[routes.hops]]
channel_pubkey = "ff2ee45601ec1b67310c7790404585ae697331eee1c1f8cf2419731c1fff3e6b" # Relay Stream
next_addr = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20"     # Bob's PeerId slot
credential = "relay-access-token"

[[routes]]
scope = "lab"
target_pubkey = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20" # Bob
plane = "datagram"
entry_channel = "udp0"
entry_addr = "127.0.0.1:16100" # H1 UDP
target_credential = "bob-e2e-token"

[[routes.hops]]
channel_pubkey = "38ab664bd86f77d7e66bdd9ae0792913a94fd8b33a1260027e4b46c1f4884c67" # H1 Datagram
next_addr = "127.0.0.1:16200"                                                       # Relay UDP
credential = "hop1-transit-token"

[[routes.hops]]
channel_pubkey = "7b0d47d93427f8311160781c7c733fd89f88970aef490d8aa0ee19a4cb8a1b14" # Relay Datagram
next_addr = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20"     # Bob's PeerId slot
credential = "relay-access-token"

[[bind_endpoints]]
scope = "lab"
target_pubkey = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20"
endpoint = "demo-app"
plane = "stream"
listen_addr = "127.0.0.1:18080"

[[bind_endpoints]]
scope = "lab"
target_pubkey = "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20"
endpoint = "demo-app"
plane = "datagram"
listen_addr = "127.0.0.1:18081"
