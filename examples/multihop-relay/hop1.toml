# Multi-Hop + Passive Relay Topology (A -> H1 -> R <- B) — Transit Hop H1
# Publishes fixed named transits ("to-relay") hiding Relay R's address and enforcing MAC2 cookies + QoS.

[policy]
default_allow = false
default_ttl_secs = 300

[[policy.rules]]
scope = "default"
peers = ["7b4e909bbe7ffe44c465a220037d608ee35897d31ef972f07f74892cb0f73f13"] # Alice
action = "transit"
plane = "stream"
target = "to-relay"
required_credential = "hop1-transit-token"
max_bytes_per_sec = 52428800

[[policy.rules]]
scope = "default"
peers = ["7b4e909bbe7ffe44c465a220037d608ee35897d31ef972f07f74892cb0f73f13"] # Alice
action = "transit"
plane = "datagram"
target = "to-relay"
required_credential = "hop1-transit-token"
max_bytes_per_sec = 52428800
max_datagrams_per_sec = 5000

[[scopes]]
name = "default"
secret_key = "5555555555555555555555555555555555555555555555555555555555555555"
under_load = true

[[udp_listeners]]
bind_addr = "127.0.0.1:16100"
mtu = 1400

[[tcp_listeners]]
listen_addr = "127.0.0.1:16101"

[[transits]]
scope = "default"
name = "to-relay"
plane = "datagram"
target_addr = "127.0.0.1:16200" # Relay R UDP
mtu = 1400

[[transits]]
scope = "default"
name = "to-relay"
plane = "stream"
target_addr = "127.0.0.1:16201" # Relay R TCP
